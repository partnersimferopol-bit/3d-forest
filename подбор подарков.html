<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор подарка 3Д-лес</title>
<!-- Шрифт: лёгкая «мастерская» читаемость, без тяжёлых начертаний -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ========== ТЕМА: СРЕЗ ДЕРЕВА / ФАНЕРА ==========
   Палитра: светлый шпон, кольца годовых слоёв, тёмная кора и «лазерный» акцент.
*/

:root {
  --wood-light: #e9dcc8;
  --wood-mid: #d4b896;
  --wood-dark: #8b6f47;
  --bark: #3d2a1a;
  --ring-soft: rgba(61, 42, 26, 0.14);
  --grain-line: rgba(45, 30, 18, 0.06);
  --panel: #f3e9dc;
  --ink: #2a1f14;
  --accent-laser: #c45c26;
  --accent-laser-hover: #a84d1f;
  --save-green: #3d6b4a;
  --save-green-hover: #325a3e;
  --shadow-deep: rgba(45, 30, 18, 0.18);
  --copper: #b87333;
  --copper-light: #d4954a;
  --copper-dark: #7a4f22;
  --font-display: "Oswald", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  margin: 0;
  padding: 24px 20px 40px;
  min-height: 100vh;
  /* Фон: имитация продольных волокон + лёгкий шум «фанеры» */
  background-color: var(--wood-mid);
  background-image:
    repeating-linear-gradient(
      88deg,
      transparent 0,
      transparent 11px,
      var(--grain-line) 11px,
      var(--grain-line) 12px
    ),
    repeating-linear-gradient(
      -3deg,
      rgba(255, 255, 255, 0.12) 0 2px,
      transparent 2px 6px
    ),
    linear-gradient(175deg, var(--wood-light) 0%, var(--wood-mid) 45%, #c9a87a 100%);
}

h1, h2, h3,
.preview h2,
.preview h3 {
  font-family: var(--font-display);
  font-weight: 600;
  color: var(--bark);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1.15;
}

h1 {
  margin: 0 0 10px;
  font-size: clamp(1.65rem, 4.2vw, 2.35rem);
  background: linear-gradient(135deg, var(--bark) 35%, var(--copper-dark) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

h2 {
  font-size: clamp(1.2rem, 2.8vw, 1.55rem);
  margin: 0 0 14px;
}

.tagline {
  margin: 0;
  max-width: 42ch;
  font-size: 1.05rem;
  opacity: 0.92;
  line-height: 1.45;
}

/* Главный экран: эмблема в стиле мастерской */
.site-hero {
  max-width: 1100px;
  margin: 0 auto 28px;
  padding: 0 4px;
}

.site-hero__inner {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: clamp(20px, 4vw, 36px);
  align-items: center;
}

@media (max-width: 720px) {
  .site-hero__inner {
    grid-template-columns: 1fr;
    justify-items: center;
    text-align: center;
  }

  .site-hero__copy .tagline {
    margin-left: auto;
    margin-right: auto;
  }
}

.emblem-showcase {
  position: relative;
  width: min(200px, 42vw);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 50%;
  flex-shrink: 0;
  background: radial-gradient(circle at 50% 42%, #4a3524 0%, var(--bark) 68%);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.12) inset,
    0 18px 40px var(--shadow-deep);
  animation: emblem-in 0.75s ease-out both;
}

.emblem-showcase__ring {
  position: absolute;
  inset: 5%;
  border-radius: 50%;
  border: 2px solid transparent;
  background:
    linear-gradient(var(--bark), var(--bark)) padding-box,
    linear-gradient(145deg, var(--copper-light), var(--copper), var(--copper-dark)) border-box;
  pointer-events: none;
}

.emblem-showcase__glow {
  position: absolute;
  inset: -10%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(212, 149, 74, 0.28) 0%, transparent 70%);
  animation: emblem-pulse 4.5s ease-in-out infinite;
  pointer-events: none;
}

@keyframes emblem-pulse {
  0%, 100% { opacity: 0.5; transform: scale(0.98); }
  50% { opacity: 0.85; transform: scale(1.02); }
}

@keyframes emblem-in {
  from { opacity: 0; transform: scale(0.94); }
  to { opacity: 1; transform: scale(1); }
}

.emblem-showcase__img {
  position: relative;
  z-index: 1;
  width: 86%;
  height: 86%;
  object-fit: contain;
  filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.4));
  transition: transform 0.4s ease;
}

.emblem-showcase:hover .emblem-showcase__img {
  transform: scale(1.04);
}

.site-hero__badge {
  display: inline-block;
  margin-top: 12px;
  padding: 6px 14px;
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff8ef;
  background: linear-gradient(135deg, var(--copper-dark), var(--copper));
  box-shadow: 0 6px 16px rgba(122, 79, 34, 0.35);
}

/* Верхняя «полоса коры» под шапкой */
.page-rim {
  max-width: 1100px;
  margin: 0 auto 20px;
  height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--bark), #5c3d28, var(--bark));
  box-shadow: 0 2px 0 rgba(255, 255, 255, 0.25);
}

.container {
  display: flex;
  flex-wrap: wrap;
  gap: 22px;
  max-width: 1100px;
  margin: 0 auto;
  align-items: flex-start;
}

/* Панели как «заготовки»: скругление + тень снизу как у толстой фанеры */
.panel {
  background: var(--panel);
  padding: 22px 24px 26px;
  border-radius: 14px;
  flex: 1 1 320px;
  border: 1px solid rgba(61, 42, 26, 0.12);
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.65) inset,
    0 12px 28px var(--shadow-deep);
  position: relative;
}

.panel::before {
  content: "";
  position: absolute;
  inset: 6px;
  border-radius: 10px;
  pointer-events: none;
  border: 1px dashed rgba(61, 42, 26, 0.08);
}

label {
  display: block;
  margin-top: 14px;
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--bark);
}

input,
select,
textarea {
  width: 100%;
  padding: 10px 12px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid rgba(61, 42, 26, 0.2);
  background: rgba(255, 255, 255, 0.75);
  font-family: inherit;
  font-size: 1rem;
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(45, 30, 18, 0.06) inset;
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid var(--accent-laser);
  outline-offset: 1px;
}

textarea {
  min-height: 88px;
  resize: vertical;
}

.preview {
  border: 2px solid rgba(61, 42, 26, 0.15);
  padding: 18px 20px;
  border-radius: 12px;
  background:
    repeating-linear-gradient(90deg, transparent, transparent 14px, var(--grain-line) 14px, var(--grain-line) 15px),
    linear-gradient(180deg, #faf6f0, #ebe0d4);
  min-height: 200px;
}

button {
  margin-top: 12px;
  padding: 12px 16px;
  width: 100%;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  transition: transform 0.08s ease, box-shadow 0.15s ease, background 0.15s ease;
}

button:active {
  transform: translateY(1px);
}

.primary {
  background: linear-gradient(180deg, var(--accent-laser), #9e4718);
  color: #fff;
  box-shadow: 0 4px 0 #6b3412, 0 6px 14px var(--shadow-deep);
}

.primary:hover {
  background: linear-gradient(180deg, var(--accent-laser-hover), #863c14);
}

.save {
  background: linear-gradient(180deg, var(--save-green), #2d4f36);
  color: #fff;
  box-shadow: 0 4px 0 #1e3526, 0 6px 14px var(--shadow-deep);
}

.save:hover {
  background: linear-gradient(180deg, var(--save-green-hover), #243d2c);
}

.total-line {
  margin-top: 18px;
  padding-top: 8px;
  border-top: 2px solid rgba(61, 42, 26, 0.12);
}

.total-line h3 {
  margin: 0;
  font-size: 1.35rem;
}

hr {
  border: none;
  border-top: 1px solid rgba(61, 42, 26, 0.15);
  margin: 22px 0;
}

/* ===== Каталог: карточки «как срез брёвна» ===== */
.catalog {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}

.product {
  background: rgba(255, 255, 255, 0.45);
  border-radius: 12px;
  padding: 12px;
  border: 1px solid rgba(61, 42, 26, 0.12);
  box-shadow: 0 4px 12px rgba(45, 30, 18, 0.08);
}

.product p {
  margin: 8px 0 0;
}

.product strong {
  color: var(--bark);
}

.price {
  font-weight: 700;
  color: var(--save-green);
  font-size: 1.05rem;
}

/* Визуал среза: концентрические кольца + лёгкая текстура сучка */
.wood-slice-wrap {
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}

.wood-slice {
  width: min(168px, 100%);
  aspect-ratio: 1;
  border-radius: 50%;
  position: relative;
  overflow: hidden;
  border: 5px solid #5a3d24;
  box-shadow:
    inset 0 0 50px rgba(30, 20, 12, 0.35),
    0 10px 24px var(--shadow-deep);
  background-color: #deb887;
  background-image:
    radial-gradient(circle at 48% 46%, rgba(90, 55, 30, 0.35) 0%, transparent 4%),
    repeating-radial-gradient(
      circle at 50% 50%,
      #e8d4bc 0px,
      #e8d4bc 7px,
      var(--ring-soft) 7px,
      var(--ring-soft) 9px,
      #dcc4a8 9px,
      #dcc4a8 16px,
      var(--ring-soft) 16px,
      var(--ring-soft) 17.5px,
      #d2b89a 17.5px,
      #d2b89a 26px,
      var(--ring-soft) 26px,
      var(--ring-soft) 27.5px,
      #c9a882 27.5px,
      #c9a882 38px,
      var(--ring-soft) 38px,
      var(--ring-soft) 39.5px,
      #bf9e78 39.5px,
      #bf9e78 52px,
      var(--ring-soft) 52px,
      var(--ring-soft) 53.5px,
      #b4926a 53.5px,
      #b4926a 100%
    );
}

/* Тонкие радиальные «трещинки» сушки — характерный узор дерева */
.wood-slice::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: repeating-conic-gradient(
    from 0deg at 50% 50%,
    transparent 0deg 11deg,
    rgba(45, 30, 18, 0.04) 11deg 12deg
  );
  pointer-events: none;
}

.wood-slice-label {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--bark);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  opacity: 0.85;
  pointer-events: none;
  z-index: 1;
}

.tag {
  display: inline-block;
  padding: 5px 10px;
  background: rgba(61, 42, 26, 0.08);
  margin: 3px;
  border-radius: 6px;
  border: 1px solid rgba(61, 42, 26, 0.1);
}
</style>
</head>

<body>

<!-- Шапка: название и слоган (бренд остаётся «3Д-лес», визуал — мастерская из фанеры) -->
<div class="page-rim" aria-hidden="true"></div>
<header class="site-hero">
  <div class="site-hero__inner">
    <figure class="emblem-showcase">
      <div class="emblem-showcase__ring" aria-hidden="true"></div>
      <div class="emblem-showcase__glow" aria-hidden="true"></div>
      <img
        class="emblem-showcase__img"
        src="эмблема.png"
        alt="Эмблема мастерской 3Д-лес"
        width="200"
        height="200"
        decoding="async"
        fetchpriority="high"
      />
    </figure>
    <div class="site-hero__copy">
      <h1>Конструктор подарка «3Д-лес»</h1>
      <p class="tagline">Сувениры и декор из фанеры — подарки со смыслом, которые запоминаются</p>
      <span class="site-hero__badge">Лазер · фанера · 3D</span>
    </div>
  </div>
</header>

<div class="container">

  <!-- Левая колонка: форма расчёта и мини-каталог -->
  <div class="panel">

    <h2>Настройка подарка</h2>

    <label for="target">Кому подарок</label>
    <select id="target">
      <option value="0">Выберите</option>
      <option value="250">Парню / мужу</option>
      <option value="300">Маме / ребёнку</option>
      <option value="375">Друзьям</option>
    </select>

    <label for="type">Тип изделия</label>
    <select id="type">
      <option value="750">Декор из фанеры</option>
      <option value="1250">3D изделие</option>
      <option value="2000">Персональный подарок</option>
    </select>

    <label for="personal">Персонализация</label>
    <select id="personal">
      <option value="0">Без персонализации</option>
      <option value="375">Имя / дата</option>
      <option value="750">История / надпись</option>
    </select>

    <label for="speed">Срочность</label>
    <select id="speed">
      <option value="0">Стандарт (3–5 дней)</option>
      <option value="500">Срочно (1–2 дня)</option>
    </select>

    <label for="text">Ваш текст</label>
    <textarea id="text" placeholder="Пожелание, имя, дата…"></textarea>

    <button type="button" class="primary" onclick="calculate()">Рассчитать</button>
    <button type="button" class="save" onclick="saveTemplate()">Сохранить шаблон</button>

    <div class="total-line">
      <h3>Итого: <span id="total">0</span> ₽</h3>
    </div>

    <hr>

    <h2>Каталог 3Д-леса</h2>

    <p class="hint" id="catalogHint"></p>
    <div class="catalog" id="miniCatalog"></div>
  </div>

  <!-- Правая колонка: текстовый предпросмотр заказа -->
  <div class="panel">

    <h2>Предпросмотр</h2>

    <div class="preview" id="preview">
      Выберите параметры слева и нажмите «Рассчитать»
    </div>

  </div>

</div>

<script src="assets/catalog.js"></script>
<script>

function calculate() {

const target = +document.getElementById('target').value;
const type = +document.getElementById('type').value;
const personal = +document.getElementById('personal').value;
const speed = +document.getElementById('speed').value;
const text = document.getElementById('text').value;

const total = target + type + personal + speed;

document.getElementById('total').innerText = total;

updatePreview(target, type, personal, speed, text, total);
}

function updatePreview(target, type, personal, speed, text, total) {

let emotion = personal > 0 ? 'Подарок со смыслом' : 'Базовая комплектация';

document.getElementById('preview').innerHTML = `
<h3>${emotion}</h3>
<p><strong>Кому:</strong> ${getLabel('target')}</p>
<p><strong>Тип:</strong> ${getLabel('type')}</p>
<p><strong>Персонализация:</strong> ${getLabel('personal')}</p>
<p><strong>Срок:</strong> ${getLabel('speed')}</p>

${text ? `<p><strong>Текст:</strong> "${text}"</p>` : ''}

<hr>
<h2>${total} ₽</h2>
<p>Заказ из мастерской 3Д-лес (фанера, лазерная резка)</p>
`;
}

function getLabel(id){
const el = document.getElementById(id);
return el.options[el.selectedIndex].text;
}

function saveTemplate(){
localStorage.setItem('giftTemplate', JSON.stringify({
target: document.getElementById('target').value,
type: document.getElementById('type').value,
personal: document.getElementById('personal').value,
speed: document.getElementById('speed').value,
text: document.getElementById('text').value
}));
alert('Шаблон сохранён в этом браузере');
}


function renderMiniCatalog() {
  const grid = document.getElementById("miniCatalog");
  const hint = document.getElementById("catalogHint");
  if (!grid) return;
  const list =
    window.CATALOG_PRODUCTS && window.CATALOG_PRODUCTS.length
      ? window.CATALOG_PRODUCTS
      : [
          { name: "Мини-лес", price: 2990 },
          { name: "3D лес с именем", price: 4990 },
        ];
  if (hint) {
    hint.textContent = window.CATALOG_META?.syncedAt
      ? "Синхронизировано с VK: " +
        new Date(window.CATALOG_META.syncedAt).toLocaleString("ru-RU")
      : "Каталог VK: https://vk.com/market-202321163?section=album_1";
  }
  const fmt = (n) => new Intl.NumberFormat("ru-RU").format(n) + " ₽";
  grid.innerHTML = list
    .map(
      (p) =>
        '<div class="product"><div class="wood-slice-wrap"><div class="wood-slice" role="img" aria-label="Стилизация среза дерева"><span class="wood-slice-label">фанера</span></div></div><p><strong>' +
        p.name +
        "</strong></p><p class=\"price\">" +
        fmt(p.price) +
        "</p></div>"
    )
    .join("");
}

window.onload = () => {
const saved = localStorage.getItem('giftTemplate');
if(saved){
const data = JSON.parse(saved);
for(let k in data){
if(document.getElementById(k))
document.getElementById(k).value = data[k];
}
calculate();
}
renderMiniCatalog();
};

</script>

</body>
</html>
